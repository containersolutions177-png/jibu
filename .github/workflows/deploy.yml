
name: Jibu CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile backend/main.py api/index.py

      - name: Verify required project files
        run: |
          test -f backend/main.py
          test -f backend/requirements.txt
          test -f frontend/index.html
          test -f frontend/style.css
          test -f frontend/app.js
          test -f .env.example
          test -f vercel.json

      - name: Check for database dependencies
        run: |
          if grep -Eiq 'sqlalchemy|sqlite' backend/requirements.txt; then
            echo "Unexpected database dependency detected."
            exit 1
          fi

      - name: Report success
        run: echo "Jibu validation passed."
